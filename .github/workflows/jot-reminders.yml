name: Jot reminders

# Asks warbag to send Jot reminders that are due (src/app/api/jot/reminders).
# GitHub runs scheduled jobs on main only, often a few minutes late; the
# endpoint sends each reminder once whenever it's called.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set in GitHub; nothing sent."; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://warbag.rodeo/api/jot/reminders
